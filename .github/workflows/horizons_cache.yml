name: Build JPL Horizons Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizons:
    name: Horizons batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Horizons cache
        run: |
          python -u prefetch_horizons_github.py \
            --choose-file choose_horizons.txt \
            --input-dir parquet \
            --output-dir HORIZONS_CACHE \
            --location X05 \
            --step-minutes 1 10 \
            --pad-minutes 10 \
            --batch-index "${{ matrix.batch }}" \
            --num-batches 8 \
            --retries 4 \
            --sleep-seconds 1.5

      - name: Show generated cache
        if: always()
        run: |
          echo "Files generated by this batch:"
          find HORIZONS_CACHE -maxdepth 1 -type f -name '*.csv' -printf '%f\n' | sort || true
          du -sh HORIZONS_CACHE || true

      - name: Upload cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizons-cache-batch-${{ matrix.batch }}
          path: HORIZONS_CACHE/*.csv
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
